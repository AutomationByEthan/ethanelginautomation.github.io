# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch (main)
  push:
    branches: ['main']

  # Runs on PRs targeting the default branch
  pull_request:
    branches: ['main']

  # Also run on pushes to any other branch (for previews)
  push:
    branches-ignore: ['main']

  # Allow manual runs
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # For commenting preview URLs on PRs

# Allow one concurrent deployment per environment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: Checkout and upload the site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for artifacts
          fetch-depth: 0

      # If your site needs a build (e.g., npm run build), add it here.
      # For plain HTML/CSS/JS, skip — just upload everything.
      # Example if needed: - name: Build → run: npm ci && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload root directory (or change to 'dist' if you have a build folder)
          path: '.'

  # Deploy job for production (main branch)
  deploy-production:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only deploy main to production
    steps:
      - name: Deploy to production
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploy job for previews (branches/PRs)
  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'  # Previews for PRs/other branches
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      # Auto-comment the preview URL on PRs (optional but handy)
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pageUrl = '${{ steps.deployment.outputs.page_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: `🔍 **Preview deployed!** Test your changes live here: ${pageUrl}`
            });
